<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - User Profile & Settings</title>
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
</head>
<body>
    <div class="max-width-container">
        <!-- Core Header Integration -->
        <city-header></city-header>

        <main style="padding: 10px 16px; display: flex; flex-direction: column; gap: 16px; margin-bottom: 70px;">
            <!-- Profile Overview Card -->
            <div style="background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 16px;">
                <div style="width: 60px; height: 60px; background: rgba(59,130,246,0.1); border: 2px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px;">
                    👤
                </div>
                <div>
                    <h3 style="font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px;">Anup Sharma</h3>
                    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 2px;">+91 98765 43210</p>
                    <span style="font-size: 10px; background: rgba(16,185,129,0.1); color: var(--accent-success); padding: 2px 8px; border-radius: 6px; font-weight: 600;">Verified Resident</span>
                </div>
            </div>

            <!-- Profile Options / Menu -->
            <div style="background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden;">
                <a href="location.html" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; text-decoration: none; border-bottom: 1px solid var(--card-border); color: #fff; font-size: 14px;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span>📍</span> Primary Address & Location
                    </div>
                    <span style="color: var(--text-muted);">›</span>
                </a>
                <a href="notification.html" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; text-decoration: none; border-bottom: 1px solid var(--card-border); color: #fff; font-size: 14px;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span>🔔</span> Notification Preferences
                    </div>
                    <span style="color: var(--text-muted);">›</span>
                </a>
                <a href="settings.html" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; text-decoration: none; border-bottom: 1px solid var(--card-border); color: #fff; font-size: 14px;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span>⚙️</span> App Settings & Security
                    </div>
                    <span style="color: var(--text-muted);">›</span>
                </a>
                <a href="login.html" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; text-decoration: none; color: var(--accent-danger); font-size: 14px;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span>🚪</span> Logout Session
                    </div>
                    <span>›</span>
                </a>
            </div>
        </main>

        <!-- Core Bottom Navigation Integration -->
        <bottom-nav></bottom-nav>
    </div>

    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>
</body>
</html>
