<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - My Profile</title>
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
</head>
<body>
    <div class="max-width-container">
        <!-- TOPBAR WITH BACK BUTTON -->
        <city-topbar title="My Account"></city-topbar>

        <main style="padding: 10px 16px; display: flex; flex-direction: column; gap: 14px; margin-bottom: 80px;">
            
            <!-- Header Identity Card (LINKED TO EDIT PROFILE) -->
            <!-- Yahan click karne par edit-profile.html khulega -->
            <div class="cp-card flex-between" onclick="window.location.href='edit-profile.html'" style="margin: 0; background: linear-gradient(135deg, rgba(59,130,246,0.1) 0%, rgba(13,17,23,0) 100%); border-left: 4px solid var(--accent-blue); cursor: pointer;">
                <div class="d-flex align-items-center gap-3">
                    <div style="width: 50px; height: 50px; background: var(--bg-color); border: 2px solid var(--accent-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px;">👤</div>
                    <div>
                        <h3 style="margin: 0 0 4px 0; font-size: 16px;">Anup Sharma</h3>
                        <p style="margin: 0 0 4px 0; font-size: 12px; color: var(--text-muted);">+91 98765 43210</p>
                        <span class="cp-badge-success">Verified Resident</span>
                    </div>
                </div>
                <span style="color: var(--text-muted); font-size: 20px;">›</span>
            </div>

            <!-- Wallet & Rewards (LINKED TO WALLET PAGE) -->
            <!-- Yahan click karne par wallet.html khulega -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="cp-card flex-column" onclick="window.location.href='wallet.html'" style="margin: 0; padding: 12px; gap: 6px; cursor: pointer;">
                    <span style="font-size: 11px; color: var(--text-muted); font-weight: 600;">CP Wallet Balance</span>
                    <div style="font-size: 18px; font-weight: 800; color: var(--text-main);">₹ 0.00</div>
                    <span style="font-size: 10px; color: var(--accent-blue);">View History ›</span>
                </div>
                <div class="cp-card flex-column" style="margin: 0; padding: 12px; gap: 6px; cursor: pointer;" onclick="showToast('Reward Store Coming Soon')">
                    <span style="font-size: 11px; color: var(--text-muted); font-weight: 600;">Reward Coins</span>
                    <div style="font-size: 18px; font-weight: 800; color: #f59e0b;">🪙 150</div>
                    <span style="font-size: 10px; color: #f59e0b;">Redeem Now ›</span>
                </div>
            </div>

            <city-ad-space></city-ad-space>

            <!-- Deep Content Options Navigation Menu -->
            <div class="cp-card" style="padding: 0; overflow: hidden; margin: 0;">
                
                <!-- NAYA LINK: Emergency SOS -->
                <a href="emergency-sos.html" style="display: flex; justify-content: space-between; padding: 16px; text-decoration: none; border-bottom: 1px solid var(--card-border); color: var(--text-main); font-size: 14px; background: rgba(239, 68, 68, 0.05);">
                    <div class="d-flex gap-3 align-items-center"><span style="font-size: 18px;">🚨</span> <span style="color: var(--accent-red); font-weight: 600;">Emergency SOS Contacts</span></div>
                    <span style="color: var(--text-muted);">›</span>
                </a>

                <a href="location.html" style="display: flex; justify-content: space-between; padding: 16px; text-decoration: none; border-bottom: 1px solid var(--card-border); color: var(--text-main); font-size: 14px;">
                    <div class="d-flex gap-3 align-items-center"><span style="font-size: 18px;">📍</span> Saved Addresses</div>
                    <span style="color: var(--text-muted);">›</span>
                </a>
                
                <a href="notification.html" style="display: flex; justify-content: space-between; padding: 16px; text-decoration: none; border-bottom: 1px solid var(--card-border); color: var(--text-main); font-size: 14px;">
                    <div class="d-flex gap-3 align-items-center"><span style="font-size: 18px;">🔔</span> Notifications</div>
                    <span style="color: var(--text-muted);">›</span>
                </a>
                
                <a href="settings.html" style="display: flex; justify-content: space-between; padding: 16px; text-decoration: none; border-bottom: 1px solid var(--card-border); color: var(--text-main); font-size: 14px;">
                    <div class="d-flex gap-3 align-items-center"><span style="font-size: 18px;">⚙️</span> App Settings & Privacy</div>
                    <span style="color: var(--text-muted);">›</span>
                </a>
                
                <div onclick="showToast('Securely Logging Out...')" style="display: flex; justify-content: space-between; padding: 16px; color: var(--accent-red); font-size: 14px; cursor: pointer;">
                    <div class="d-flex gap-3 align-items-center"><span style="font-size: 18px;">🚪</span> Logout of CityPulse</div>
                    <span>›</span>
                </div>
            </div>
        </main>

        <bottom-nav></bottom-nav>
    </div>

    <!-- Master Scripts -->
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/config.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/store.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>
</body>
</html>
