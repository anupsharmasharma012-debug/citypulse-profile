<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - My Profile</title>
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
</head>
<body>
    <div class="max-width-container">
        <city-header></city-header>

        <main style="padding: 10px 16px; display: flex; flex-direction: column; margin-bottom: 80px;">
            
            <city-ad-space></city-ad-space>

            <!-- Profile Info Card -->
            <div class="cp-card flex-between">
                <div class="d-flex align-items-center gap-3">
                    <div style="width: 50px; height: 50px; background: rgba(59,130,246,0.1); border: 2px solid var(--accent-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px;">👤</div>
                    <div>
                        <h3 style="margin: 0 0 4px 0; font-size: 16px;">Anup Sharma</h3>
                        <p style="margin: 0 0 4px 0; font-size: 12px; color: var(--text-muted);">+91 98765 43210</p>
                        <span class="cp-badge-success">Verified Resident</span>
                    </div>
                </div>
            </div>

            <!-- Deep Content Options Card -->
            <div class="cp-card" style="padding: 0; overflow: hidden;">
                <a href="location.html" style="display: flex; justify-content: space-between; padding: 16px; text-decoration: none; border-bottom: 1px solid var(--card-border); color: var(--text-main); font-size: 14px;">
                    <div class="d-flex gap-2"><span>📍</span> Location & Pincode</div>
                    <span style="color: var(--text-muted);">›</span>
                </a>
                <a href="notification.html" style="display: flex; justify-content: space-between; padding: 16px; text-decoration: none; border-bottom: 1px solid var(--card-border); color: var(--text-main); font-size: 14px;">
                    <div class="d-flex gap-2"><span>🔔</span> Notifications</div>
                    <span style="color: var(--text-muted);">›</span>
                </a>
                <a href="settings.html" style="display: flex; justify-content: space-between; padding: 16px; text-decoration: none; border-bottom: 1px solid var(--card-border); color: var(--text-main); font-size: 14px;">
                    <div class="d-flex gap-2"><span>⚙️</span> App Settings & Security</div>
                    <span style="color: var(--text-muted);">›</span>
                </a>
                
                <!-- Mock Logic: Logout triggers toast -->
                <div onclick="showToast('Logging out...')" style="display: flex; justify-content: space-between; padding: 16px; color: var(--accent-red); font-size: 14px; cursor: pointer;">
                    <div class="d-flex gap-2"><span>🚪</span> Secure Logout</div>
                    <span>›</span>
                </div>
            </div>
        </main>

        <bottom-nav></bottom-nav>
    </div>

    <!-- Master Scripts -->
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/config.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/store.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/utils.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/auth-guard.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>
    
    <!-- Activate Auth Guard for this page -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Uncomment next line to test auth blocking
            // AuthGuard.protectPage(); 
        });
    </script>
</body>
</html>
