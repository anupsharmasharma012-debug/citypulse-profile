<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Login & Authentication</title>
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
</head>
<body>
    <div class="max-width-container">
        <!-- Core Header Integration -->
        <city-header></city-header>

        <main style="padding: 20px; display: flex; flex-direction: column; justify-content: center; flex: 1;">
            <div style="background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 24px; text-align: center;">
                <div style="font-size: 36px; margin-bottom: 12px;">🔐</div>
                <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Welcome to CityPulse</h2>
                <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 24px;">Login or create an account to access local services, civic updates, and utilities.</p>

                <!-- Mobile OTP Input Section -->
                <div style="display: flex; flex-direction: column; gap: 12px; text-align: left;">
                    <label style="font-size: 12px; color: var(--text-muted); font-weight: 600;">Mobile Number</label>
                    <div style="display: flex; align-items: center; background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 14px;">
                        <span style="color: var(--text-muted); margin-right: 8px; font-size: 14px;">+91</span>
                        <input type="tel" placeholder="Enter 10-digit mobile number" maxlength="10" style="background: transparent; border: none; color: #fff; outline: none; width: 100%; font-size: 14px;">
                    </div>
                    
                    <button style="background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 8px;">Get OTP</button>
                </div>

                <div style="display: flex; align-items: center; margin: 20px 0; color: var(--text-muted); font-size: 12px;">
                    <div style="flex: 1; height: 1px; background: var(--card-border);"></div>
                    <span style="padding: 0 10px;">OR</span>
                    <div style="flex: 1; height: 1px; background: var(--card-border);"></div>
                </div>

                <!-- Social & Guest Login Options -->
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button style="background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--card-border); border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
                        <span>🌐</span> Continue with Google
                    </button>
                    <button style="background: transparent; color: var(--text-muted); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer;">
                        Continue as Guest
                    </button>
                </div>
            </div>
        </main>

        <!-- Core Bottom Navigation Integration -->
        <bottom-nav></bottom-nav>
    </div>

    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>
</body>
</html>
