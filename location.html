<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Location</title>
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
</head>
<body>
    <div class="max-width-container">
        <city-header></city-header>
        <main style="padding: 10px 16px; margin-bottom: 80px;" class="flex-column gap-3">
            
            <div class="cp-card flex-column gap-3">
                <div class="flex-between">
                    <span style="font-size: 12px; color: var(--text-muted); font-weight: 600;">ACTIVE LOCATION</span>
                    <span style="font-size: 10px; background: rgba(59,130,246,0.1); color: var(--accent-blue); padding: 3px 8px; border-radius: 6px; font-weight: 600;">GPS Active</span>
                </div>
                <div class="d-flex gap-3 align-items-center">
                    <span style="font-size: 24px;">📍</span>
                    <div>
                        <h3 style="margin: 0 0 2px 0; font-size: 16px;">Bhatpara, West Bengal</h3>
                        <p style="margin: 0; font-size: 12px; color: var(--text-muted);">Pincode: 743123</p>
                    </div>
                </div>
                <button class="cp-btn-outline" style="font-size: 13px;" onclick="showLoader(); setTimeout(() => { hideLoader(); showToast('Location Updated!'); }, 1500)">
                    🛰️ Auto-Detect Location
                </button>
            </div>

            <div class="cp-card">
                <h3 style="margin: 0 0 12px 0; font-size: 14px;">Saved Presets</h3>
                <div class="flex-column gap-2">
                    <div class="flex-between" style="padding: 12px; background: rgba(150,150,150,0.05); border: 1px solid var(--card-border); border-radius: 10px;">
                        <div class="d-flex gap-2 align-items-center">
                            <span>🏠</span>
                            <div>
                                <div style="font-size: 13px; font-weight: 600;">Home</div>
                                <div style="font-size: 11px; color: var(--text-muted);">Bhatpara Main Road</div>
                            </div>
                        </div>
                        <span style="font-size: 11px; color: var(--accent-blue); font-weight: 600;">Selected</span>
                    </div>
                </div>
            </div>
        </main>
        <bottom-nav></bottom-nav>
    </div>
    <!-- Master Scripts -->
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/config.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/store.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>
</body>
</html>
