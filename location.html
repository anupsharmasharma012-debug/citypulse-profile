<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Location & Address Manager</title>
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
</head>
<body>
    <div class="max-width-container">
        <city-header></city-header>
        <main style="padding: 10px 16px; display: flex; flex-direction: column; gap: 16px; margin-bottom: 70px;">
            <div style="background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <span style="font-size: 13px; color: var(--text-muted); font-weight: 600;">CURRENT ACTIVE LOCATION</span>
                    <span style="font-size: 10px; background: rgba(59,130,246,0.1); color: #3b82f6; padding: 2px 8px; border-radius: 6px; font-weight: 600;">GPS Active</span>
                </div>
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
                    <span style="font-size: 24px;">📍</span>
                    <div>
                        <h3 style="font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 2px;">Bhatpara, West Bengal</h3>
                        <p style="font-size: 12px; color: var(--text-muted);">North 24 Parganas District • Pin: 743123</p>
                    </div>
                </div>
                <button style="width: 100%; background: rgba(150,150,150,0.1); color: var(--text-main); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <span>🛰️</span> Auto-Detect Current Location via GPS
                </button>
            </div>
            <div style="background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px;">
                <h3 style="font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 12px;">Saved Presets</h3>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(150,150,150,0.05); border: 1px solid var(--card-border); border-radius: 10px;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span>🏠</span>
                            <div>
                                <div style="font-size: 13px; font-weight: 600; color: var(--text-main);">Home</div>
                                <div style="font-size: 11px; color: var(--text-muted);">Bhatpara Main Road</div>
                            </div>
                        </div>
                        <span style="font-size: 11px; color: #3b82f6; font-weight: 600;">Selected</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(150,150,150,0.05); border: 1px solid var(--card-border); border-radius: 10px;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span>💼</span>
                            <div>
                                <div style="font-size: 13px; font-weight: 600; color: var(--text-main);">Work / Business</div>
                                <div style="font-size: 11px; color: var(--text-muted);">Retail & Wholesale Hub</div>
                            </div>
                        </div>
                        <button style="background: transparent; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer;">Switch</button>
                    </div>
                </div>
            </div>
        </main>
        <bottom-nav></bottom-nav>
    </div>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>
</body>
</html>
