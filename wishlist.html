<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - My Wishlist</title>
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
    <style>
        :root {
            --bg-light: #f8fafc;
            --cp-pink: #ec4899;
            --cp-blue: #3b82f6;
            --cp-green: #10b981;
        }
        body, .max-width-container { background-color: var(--bg-light); }

        /* Wishlist Grid & Cards */
        .wishlist-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 16px; }
        .wish-card { background: var(--card-bg); border-radius: 16px; overflow: hidden; border: 1px solid var(--card-border); box-shadow: 0 4px 10px rgba(0,0,0,0.03); display: flex; flex-direction: column; position: relative; }
        
        .wish-img-area { height: 110px; background: rgba(236, 72, 153, 0.05); display: flex; justify-content: center; align-items: center; font-size: 40px; position: relative; }
        .remove-heart { position: absolute; top: 8px; right: 8px; background: white; width: 28px; height: 28px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); cursor: pointer; }
        
        .wish-content { padding: 12px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
        .wish-title { font-size: 13px; font-weight: 800; color: var(--text-main); margin-bottom: 2px; }
        .wish-sub { font-size: 10px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
        .wish-price { font-size: 14px; font-weight: 900; color: var(--text-main); margin-bottom: 10px; }
        
        .add-to-cart-btn { background: rgba(59, 130, 246, 0.1); color: var(--cp-blue); border: none; padding: 8px; border-radius: 10px; font-size: 11px; font-weight: 800; text-align: center; cursor: pointer; transition: background 0.2s; }
        .add-to-cart-btn:active { background: rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body>
    <div class="max-width-container" style="min-height: 100vh;">
        
        <city-topbar title="My Wishlist (2)"></city-topbar>
        
        <main style="padding-bottom: 90px;">
            
            <div class="wishlist-grid">
                
                <!-- Item 1 -->
                <div class="wish-card">
                    <div class="wish-img-area">
                        <span>🎧</span>
                        <div class="remove-heart" onclick="this.parentElement.parentElement.style.display='none'; showToast('Removed from Wishlist')">❤️</div>
                    </div>
                    <div class="wish-content">
                        <div>
                            <div class="wish-title">boAt Rockerz Wireless</div>
                            <div class="wish-sub">Electronics • In Stock</div>
                            <div class="wish-price">₹1,299 <span style="font-size: 10px; color: var(--text-muted); text-decoration: line-through;">₹2,999</span></div>
                        </div>
                        <button class="add-to-cart-btn" onclick="showToast('Moved to Cart 🛒')">Move to Cart</button>
                    </div>
                </div>

                <!-- Item 2 -->
                <div class="wish-card">
                    <div class="wish-img-area" style="background: rgba(16, 185, 129, 0.05);">
                        <span>⚡</span>
                        <div class="remove-heart" onclick="this.parentElement.parentElement.style.display='none'; showToast('Removed from Wishlist')">❤️</div>
                    </div>
                    <div class="wish-content">
                        <div>
                            <div class="wish-title">Microtek Solar Inverter</div>
                            <div class="wish-sub">Home Energy • 1kW</div>
                            <div class="wish-price">₹18,500</div>
                        </div>
                        <button class="add-to-cart-btn" onclick="showToast('Moved to Cart 🛒')">Move to Cart</button>
                    </div>
                </div>

            </div>

        </main>
        
        <bottom-nav></bottom-nav>
    </div>

    <!-- Master Scripts -->
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/config.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/store.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('cp_theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }
        });
        function showToast(msg) { alert(msg); }
    </script>
</body>
</html>
