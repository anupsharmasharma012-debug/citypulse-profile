<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Notifications Setup</title>
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
    <style>
        .toggle-switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--card-border); transition: .4s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-blue); }
        input:checked + .slider:before { transform: translateX(18px); }
    </style>
</head>
<body>
    <div class="max-width-container">
        <city-topbar title="Notifications & Alerts"></city-topbar>
        
        <main style="padding: 10px 16px; margin-bottom: 80px;" class="flex-column gap-4">
            
            <div>
                <h4 style="font-size: 11px; color: var(--text-muted); margin: 0 0 8px 10px; font-weight: 800; text-transform: uppercase;">Alert Preferences</h4>
                <div class="cp-card" style="padding: 0; overflow: hidden; margin: 0;">
                    
                    <div class="flex-between" style="padding: 16px; border-bottom: 1px solid var(--card-border);">
                        <div>
                            <div style="font-size: 14px; font-weight: 600;">Transactions & Alerts</div>
                            <div style="font-size: 10px; color: var(--text-muted); margin-top: 2px;">Essential wallet updates</div>
                        </div>
                        <label class="toggle-switch"><input type="checkbox" checked disabled><span class="slider"></span></label>
                    </div>

                    <div class="flex-between" style="padding: 16px; border-bottom: 1px solid var(--card-border);">
                        <div>
                            <div style="font-size: 14px; font-weight: 600;">Marketing & Offers</div>
                            <div style="font-size: 10px; color: var(--text-muted); margin-top: 2px;">Promo codes and discounts</div>
                        </div>
                        <label class="toggle-switch"><input type="checkbox"><span class="slider"></span></label>
                    </div>

                    <div class="flex-between" style="padding: 16px;">
                        <div>
                            <div style="font-size: 14px; font-weight: 600;">Do Not Disturb (DND)</div>
                            <div style="font-size: 10px; color: var(--text-muted); margin-top: 2px;">Mute alerts during night</div>
                        </div>
                        <label class="toggle-switch"><input type="checkbox" onchange="showToast('DND mode enabled for 8 hours')"><span class="slider"></span></label>
                    </div>

                </div>
            </div>

        </main>
    </div>

    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>
</body>
</html>
