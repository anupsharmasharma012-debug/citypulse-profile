<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Security</title>
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
    <style>
        .toggle-switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--card-border); transition: .4s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-blue); }
        input:checked + .slider:before { transform: translateX(18px); }
    </style>
</head>
<body>
    <div class="max-width-container">
        <city-topbar title="Security & App Lock"></city-topbar>
        
        <main style="padding: 10px 16px; margin-bottom: 80px;" class="flex-column gap-4">
            
            <!-- App Lock Deep Options -->
            <div class="cp-card flex-column gap-3" style="margin: 0;">
                <h3 style="margin: 0; font-size: 14px;">App Lock Settings</h3>
                
                <div class="flex-between" style="border-bottom: 1px solid var(--card-border); padding-bottom: 12px;">
                    <div>
                        <div style="font-size: 13px; font-weight: 700;">Biometric Unlock</div>
                        <div style="font-size: 11px; color: var(--text-muted);">Use Fingerprint or Face ID</div>
                    </div>
                    <label class="toggle-switch"><input type="checkbox" checked><span class="slider"></span></label>
                </div>

                <div style="border-bottom: 1px solid var(--card-border); padding-bottom: 12px;">
                    <label style="font-size: 11px; color: var(--text-muted); font-weight: 600;">Fallback Lock Type</label>
                    <select class="cp-input" style="margin-top: 6px;">
                        <option selected>4-Digit PIN</option>
                        <option>Pattern Lock</option>
                        <option>Alphanumeric Password</option>
                    </select>
                </div>

                <div class="flex-between" style="cursor: pointer; border-bottom: 1px solid var(--card-border); padding-bottom: 12px;" onclick="showToast('Verification Required')">
                    <div>
                        <div style="font-size: 13px; font-weight: 700;">Change Current PIN / Pattern</div>
                        <div style="font-size: 11px; color: var(--text-muted);">Set a new lock code</div>
                    </div>
                    <span style="color: var(--text-muted);">›</span>
                </div>

                <div style="text-align: center; padding-top: 8px;">
                    <button style="background: transparent; border: none; color: var(--accent-blue); font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: underline;" onclick="showToast('OTP sent to your registered mobile number')">Forgot PIN / Password?</button>
                </div>
            </div>

            <!-- Manage Devices -->
            <div class="cp-card flex-column gap-3" style="margin: 0;">
                <h3 style="margin: 0; font-size: 14px;">Connected Devices</h3>
                <div class="flex-between" style="padding: 12px; background: rgba(150,150,150,0.05); border: 1px solid var(--card-border); border-radius: 10px;">
                    <div class="d-flex gap-3 align-items-center">
                        <span style="font-size: 20px;">💻</span>
                        <div>
                            <div style="font-size: 13px; font-weight: 700;">Windows PC / Edge</div>
                            <div style="font-size: 10px; color: var(--text-muted);">Kolkata • Last active 3 days ago</div>
                        </div>
                    </div>
                    <button style="background: rgba(239, 68, 68, 0.1); border: none; color: var(--accent-red); padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer;">Remove</button>
                </div>
            </div>

        </main>
    </div>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>
</body>
</html>
