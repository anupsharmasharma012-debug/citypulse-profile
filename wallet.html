<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse Pay - Wallet</title>
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
    <style>
        :root {
            --bg-light: #f8fafc;
            --cp-blue: #2563eb;
            --cp-green: #10b981;
        }
        body, .max-width-container { background-color: var(--bg-light); }

        /* Titanium Wallet Card */
        .titanium-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-radius: 20px; padding: 24px; margin: 16px; color: white; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.3); position: relative; overflow: hidden; }
        .titanium-card::before { content: ""; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; background: rgba(255,255,255,0.05); border-radius: 50%; }
        
        .wallet-actions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 0 16px 24px 16px; }
        .w-action-btn { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--text-main); cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .w-action-btn:active { transform: scale(0.96); }

        /* Transaction History */
        .tx-card { background: var(--card-bg); border-radius: 16px; margin: 0 16px 12px 16px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--card-border); box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .section-header { font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin: 0 0 10px 20px; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <div class="max-width-container" style="min-height: 100vh;">
        
        <city-topbar title="CityPulse Pay (Wallet)"></city-topbar>
        
        <main style="padding-bottom: 90px;">
            
            <!-- TITANIUM BALANCE CARD -->
            <div class="titanium-card">
                <div style="font-size: 11px; font-weight: 700; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px;">Available Balance</div>
                <div style="font-size: 32px; font-weight: 900; margin: 6px 0 16px 0;">₹ 1,250.00</div>
                <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 14px;">
                    <span style="font-size: 12px; font-weight: 600;">Account: Anup Sharma</span>
                    <span style="font-size: 11px; background: rgba(16,185,129,0.2); color: #34d399; padding: 4px 10px; border-radius: 20px; font-weight: 800;">KYC Verified ✔</span>
                </div>
            </div>

            <!-- QUICK ACTIONS -->
            <div class="wallet-actions-grid">
                <div class="w-action-btn" onclick="showToast('Opening UPI Gateway...')">
                    <span style="font-size: 22px;">➕</span> Add Money
                </div>
                <div class="w-action-btn" onclick="showToast('Opening Scanner...')">
                    <span style="font-size: 22px;">📷</span> Scan & Pay
                </div>
                <div class="w-action-btn" onclick="showToast('Opening Rewards...')">
                    <span style="font-size: 22px;">🎁</span> Earn Rewards
                </div>
            </div>

            <!-- TRANSACTION HISTORY -->
            <div class="section-header">Recent Transactions</div>
            
            <div class="tx-card">
                <div style="display: flex; gap: 12px; align-items: center;">
                    <div style="width: 38px; height: 38px; background: rgba(239, 68, 68, 0.1); color: #ef4444; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 18px;">🛒</div>
                    <div>
                        <div style="font-size: 13px; font-weight: 800; color: var(--text-main);">Bhatpara Grocery Mart</div>
                        <div style="font-size: 10px; color: var(--text-muted); font-weight: 600;">Today, 11:30 AM • Wallet Pay</div>
                    </div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 13px; font-weight: 900; color: #ef4444;">-₹306.50</div>
                    <div style="font-size: 9px; color: var(--cp-green); font-weight: 800;">SUCCESS</div>
                </div>
            </div>

            <div class="tx-card">
                <div style="display: flex; gap: 12px; align-items: center;">
                    <div style="width: 38px; height: 38px; background: rgba(16, 185, 129, 0.1); color: var(--cp-green); border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 18px;">💰</div>
                    <div>
                        <div style="font-size: 13px; font-weight: 800; color: var(--text-main);">Added via UPI (SBI)</div>
                        <div style="font-size: 10px; color: var(--text-muted); font-weight: 600;">28 Aug 2026 • Top-up</div>
                    </div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 13px; font-weight: 900; color: var(--cp-green);">+₹1,000.00</div>
                    <div style="font-size: 9px; color: var(--cp-green); font-weight: 800;">SUCCESS</div>
                </div>
            </div>

        </main>
        
        <bottom-nav></bottom-nav>
    </div>

    <!-- Master Scripts -->
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/config.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/store.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('cp_theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }
        });
        function showToast(msg) { alert(msg); }
    </script>
</body>
</html>
