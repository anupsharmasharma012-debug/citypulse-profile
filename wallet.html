<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Wallet & History</title>
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
</head>
<body>
    <div class="max-width-container">
        <city-topbar title="Wallet & Transactions"></city-topbar>
        
        <main style="padding: 10px 16px; margin-bottom: 80px;" class="flex-column gap-4">
            
            <!-- Wallet Balance Card -->
            <div class="cp-card" style="background: linear-gradient(135deg, var(--accent-blue) 0%, #1e3a8a 100%); color: #fff; border: none; padding: 20px;">
                <div style="font-size: 12px; opacity: 0.8; font-weight: 600;">Total CP Balance</div>
                <div class="flex-between" style="margin-top: 5px;">
                    <div style="font-size: 32px; font-weight: 800;">₹ 1,250.00</div>
                    <button style="background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 8px 16px; border-radius: 20px; font-weight: 700; cursor: pointer;" onclick="showToast('Gateway Opening...')">+ Add Money</button>
                </div>
                <div style="margin-top: 15px; font-size: 11px; opacity: 0.8;">CP Coins: 🪙 150 (₹15 value)</div>
            </div>

            <!-- Quick Actions -->
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; text-align: center;">
                <div class="cp-card" style="padding: 12px; cursor: pointer;" onclick="showToast('Scanning QR...')">
                    <div style="font-size: 24px; margin-bottom: 4px;">📷</div>
                    <div style="font-size: 10px; font-weight: 700;">Scan & Pay</div>
                </div>
                <div class="cp-card" style="padding: 12px; cursor: pointer;">
                    <div style="font-size: 24px; margin-bottom: 4px;">🎁</div>
                    <div style="font-size: 10px; font-weight: 700;">Gift Cards</div>
                </div>
                <div class="cp-card" style="padding: 12px; cursor: pointer;">
                    <div style="font-size: 24px; margin-bottom: 4px;">💸</div>
                    <div style="font-size: 10px; font-weight: 700;">Send to Bank</div>
                </div>
            </div>

            <!-- Transaction History -->
            <div>
                <h3 style="font-size: 14px; margin: 0 0 12px 0;">Recent Transactions</h3>
                <div class="cp-card flex-column gap-2" style="padding: 0; overflow: hidden;">
                    
                    <div class="flex-between" style="padding: 16px; border-bottom: 1px solid var(--card-border);">
                        <div class="d-flex gap-3 align-items-center">
                            <div style="width: 40px; height: 40px; background: rgba(239, 68, 68, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px;">🚕</div>
                            <div>
                                <div style="font-size: 13px; font-weight: 700;">CityPulse Ride</div>
                                <div style="font-size: 10px; color: var(--text-muted);">Today, 10:45 AM</div>
                            </div>
                        </div>
                        <div style="font-size: 13px; font-weight: 700; color: var(--text-main);">- ₹ 120.00</div>
                    </div>

                    <div class="flex-between" style="padding: 16px; border-bottom: 1px solid var(--card-border);">
                        <div class="d-flex gap-3 align-items-center">
                            <div style="width: 40px; height: 40px; background: rgba(16, 185, 129, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px;">💳</div>
                            <div>
                                <div style="font-size: 13px; font-weight: 700;">Money Added</div>
                                <div style="font-size: 10px; color: var(--text-muted);">Yesterday, 5:00 PM</div>
                            </div>
                        </div>
                        <div style="font-size: 13px; font-weight: 700; color: var(--accent-green);">+ ₹ 500.00</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/config.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/store.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>
</body>
</html>
