<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Starting...</title>
    <!-- Master CSS -->
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
    <style>
        /* Special Splash Screen Styles */
        body {
            /* Vibrant Gradient Background representing DAR Company branding */
            background: linear-gradient(135deg, #0d1117 0%, #1e3a8a 100%) !important;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle Background Watermark for DAR */
        .dar-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 150px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            z-index: 0;
            letter-spacing: -5px;
            pointer-events: none;
        }

        .splash-content {
            z-index: 1;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        .logo-icon {
            font-size: 70px;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.5));
        }

        .app-title {
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            margin: 0;
            letter-spacing: 1px;
        }

        .app-tagline {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 5px;
            font-weight: 500;
        }

        .bottom-branding {
            position: absolute;
            bottom: 30px;
            z-index: 1;
            text-align: center;
            animation: slideUp 1s ease-in-out;
        }

        /* Animations */
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes slideUp { 0% { opacity: 0; bottom: 10px; } 100% { opacity: 1; bottom: 30px; } }
    </style>
</head>
<body>
    
    <div class="max-width-container" style="background: transparent; box-shadow: none; display: flex; justify-content: center; align-items: center; height: 100vh;">
        
        <!-- DAR Background Watermark -->
        <div class="dar-watermark">DAR</div>

        <!-- Main Logo Area -->
        <div class="splash-content">
            <div class="logo-icon">🏙️</div>
            <h1 class="app-title">CityPulse</h1>
            <div class="app-tagline">Your Local Super App</div>
        </div>

        <!-- Footer Branding -->
        <div class="bottom-branding">
            <div style="font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 1px;">From the house of</div>
            <div style="font-size: 16px; font-weight: 800; color: #ffffff; margin-top: 2px;">RAD ENTERPRISES</div>
            <div style="margin-top: 15px;">
                <div class="cp-spinner" style="width: 24px; height: 24px; border-width: 3px; margin: 0 auto; border-top-color: #ffffff;"></div>
            </div>
        </div>

    </div>

    <!-- Core Scripts for Routing Logic -->
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/config.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/store.js"></script>
    
    <script>
        // Splash Screen Routing Logic
        document.addEventListener("DOMContentLoaded", () => {
            
            // Wait for 2.5 seconds to show the branding animation
            setTimeout(() => {
                
                // Check if user is already logged in
                const user = CityStore.getUser();
                
                if (user && user.loggedIn) {
                    // User is logged in, send to Home Page (Core Repo)
                    window.location.href = CITYPULSE_CONFIG.urls.core + "index.html";
                } else {
                    // New user or logged out, send to Login Page
                    window.location.href = "login.html";
                }
                
            }, 2500); 
        });
    </script>
</body>
</html>
