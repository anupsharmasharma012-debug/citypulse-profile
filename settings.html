<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Settings</title>
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
</head>
<body>
    <div class="max-width-container">
        <city-header></city-header>
        <main style="padding: 10px 16px; margin-bottom: 80px;" class="flex-column gap-3">
            <h3 style="margin: 0; font-size: 16px;">App Settings & Preferences</h3>
            
            <div class="cp-card" style="padding: 0; overflow: hidden;">
                <!-- Theme Toggle connected to global function -->
                <div onclick="toggleTheme()" class="flex-between" style="padding: 16px; border-bottom: 1px solid var(--card-border); cursor: pointer; font-size: 14px;">
                    <div class="d-flex gap-2"><span>🌙</span> Dark / Light Mode</div>
                    <span style="font-size: 12px; color: var(--accent-blue); font-weight: 600;">Toggle ⚡</span>
                </div>
                <div class="flex-between" style="padding: 16px; border-bottom: 1px solid var(--card-border); font-size: 14px;">
                    <div class="d-flex gap-2"><span>🔒</span> Biometric App Lock</div>
                    <span style="font-size: 12px; color: var(--text-muted);">Coming Soon</span>
                </div>
                <div class="flex-between" style="padding: 16px; border-bottom: 1px solid var(--card-border); font-size: 14px; cursor: pointer;">
                    <div class="d-flex gap-2"><span>💬</span> Help & Support</div>
                    <span style="color: var(--text-muted);">›</span>
                </div>
                <div class="flex-between" style="padding: 16px; font-size: 14px; cursor: pointer;">
                    <div class="d-flex gap-2"><span>🛠️</span> Privacy Policy</div>
                    <span style="color: var(--text-muted);">›</span>
                </div>
            </div>
        </main>
        <bottom-nav></bottom-nav>
    </div>
    <!-- Master Scripts -->
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/config.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/store.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>
</body>
</html>
