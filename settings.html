<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Settings</title>
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
</head>
<body>
    <div class="max-width-container">
        <!-- Naya Back Button Wala Topbar -->
        <city-topbar title="Settings & Privacy"></city-topbar>
        
        <main style="padding: 10px 16px; margin-bottom: 80px;" class="flex-column gap-4">
            
            <!-- App Appearance Settings -->
            <div>
                <h4 style="font-size: 12px; color: var(--text-muted); margin: 0 0 10px 10px; font-weight: 700; text-transform: uppercase;">Display & Appearance</h4>
                <div class="cp-card" style="padding: 0; overflow: hidden; margin: 0;">
                    <div onclick="toggleTheme()" class="flex-between" style="padding: 16px; border-bottom: 1px solid var(--card-border); cursor: pointer;">
                        <div class="d-flex gap-3 align-items-center">
                            <span style="font-size: 20px;">🌙</span>
                            <div>
                                <div style="font-size: 14px; font-weight: 600;">Theme Mode</div>
                                <div style="font-size: 11px; color: var(--text-muted);">Switch between Dark & Light</div>
                            </div>
                        </div>
                        <span style="font-size: 12px; color: var(--accent-blue); font-weight: 700;">Toggle ⚡</span>
                    </div>
                    <div class="flex-between" style="padding: 16px;">
                        <div class="d-flex gap-3 align-items-center">
                            <span style="font-size: 20px;">🗣️</span>
                            <div>
                                <div style="font-size: 14px; font-weight: 600;">App Language</div>
                                <div style="font-size: 11px; color: var(--text-muted);">Currently: English</div>
                            </div>
                        </div>
                        <span style="color: var(--text-muted);">›</span>
                    </div>
                </div>
            </div>

            <!-- Security Settings -->
            <div>
                <h4 style="font-size: 12px; color: var(--text-muted); margin: 0 0 10px 10px; font-weight: 700; text-transform: uppercase;">Privacy & Security</h4>
                <div class="cp-card" style="padding: 0; overflow: hidden; margin: 0;">
                    <div class="flex-between" style="padding: 16px; border-bottom: 1px solid var(--card-border);">
                        <div class="d-flex gap-3 align-items-center">
                            <span style="font-size: 20px;">🔒</span>
                            <div style="font-size: 14px; font-weight: 600;">Biometric App Lock</div>
                        </div>
                        <input type="checkbox" style="width: 18px; height: 18px; accent-color: var(--accent-blue);" disabled>
                    </div>
                    <div class="flex-between" style="padding: 16px; border-bottom: 1px solid var(--card-border);">
                        <div class="d-flex gap-3 align-items-center">
                            <span style="font-size: 20px;">📍</span>
                            <div style="font-size: 14px; font-weight: 600;">Location Access</div>
                        </div>
                        <span style="font-size: 11px; color: var(--accent-green); font-weight: 600;">Allowed</span>
                    </div>
                    <div class="flex-between" style="padding: 16px; color: var(--accent-red); cursor: pointer;" onclick="showToast('This will wipe local storage!')">
                        <div class="d-flex gap-3 align-items-center">
                            <span style="font-size: 20px;">🗑️</span>
                            <div style="font-size: 14px; font-weight: 600;">Clear App Cache Data</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- About -->
            <div style="text-align: center; color: var(--text-muted); margin-top: 10px;">
                <div style="font-weight: 700; font-size: 14px; color: var(--text-main);">CityPulse Super App</div>
                <div style="font-size: 11px;">Version 1.0.0 (Beta)</div>
                <div style="font-size: 11px; margin-top: 4px;">Designed with ❤️ for Local Communities</div>
            </div>

        </main>
        <bottom-nav></bottom-nav>
    </div>
    <!-- Master Scripts -->
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/config.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/store.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>
</body>
</html>
