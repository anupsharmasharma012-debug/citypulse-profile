<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Settings</title>
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
    <style>
        .toggle-switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--card-border); transition: .4s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-blue); }
        input:checked + .slider:before { transform: translateX(18px); }

        .sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1999; display: none; backdrop-filter: blur(2px); opacity: 0; transition: opacity 0.3s; }
        .bottom-sheet { position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--bg-color); border-radius: 24px 24px 0 0; z-index: 2000; padding: 24px; box-sizing: border-box; transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-top: 1px solid var(--card-border); }
        .show-modal .sheet-overlay { display: block; opacity: 1; }
        .show-modal .bottom-sheet { bottom: 0; }
    </style>
</head>
<body>
    <div class="max-width-container" id="main-container">
        <city-topbar title="Account Settings"></city-topbar>
        
        <main style="padding: 10px 16px; margin-bottom: 80px;" class="flex-column gap-4">
            
            <!-- 1. General Settings -->
            <div>
                <h4 style="font-size: 11px; color: var(--text-muted); margin: 0 0 8px 10px; font-weight: 800; text-transform: uppercase;">General</h4>
                <div class="cp-card" style="padding: 0; overflow: hidden; margin: 0;">
                    
                    <div class="flex-between" style="padding: 16px; border-bottom: 1px solid var(--card-border); cursor: pointer;" onclick="openModal('lang-modal')">
                        <div class="d-flex gap-3 align-items-center">
                            <span style="font-size: 20px;">🗣️</span>
                            <div>
                                <div style="font-size: 14px; font-weight: 600;">App Language</div>
                                <div style="font-size: 11px; color: var(--text-muted);">Currently: English</div>
                            </div>
                        </div>
                        <span style="color: var(--text-muted); font-size: 18px;">›</span>
                    </div>

                    <div class="flex-between" style="padding: 16px;">
                        <div class="d-flex gap-3 align-items-center">
                            <span style="font-size: 20px;">🌙</span>
                            <div style="font-size: 14px; font-weight: 600;">Dark Mode</div>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" id="theme-toggle" onchange="toggleTheme()">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 2. App Permissions -->
            <div>
                <h4 style="font-size: 11px; color: var(--text-muted); margin: 0 0 8px 10px; font-weight: 800; text-transform: uppercase;">App Permissions</h4>
                <div class="cp-card" style="padding: 0; overflow: hidden; margin: 0;">
                    
                    <div class="flex-between" style="padding: 16px;">
                        <div class="d-flex gap-3 align-items-center">
                            <span style="font-size: 20px;">📍</span>
                            <div>
                                <div style="font-size: 14px; font-weight: 600;">Precise Location Access</div>
                                <div style="font-size: 10px; color: var(--text-muted);">Needed for marketplace & rides</div>
                            </div>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    
                </div>
            </div>

            <!-- Danger Zone -->
            <div style="text-align: center; margin-top: 10px;">
                <button style="background: transparent; border: 1px solid rgba(239, 68, 68, 0.3); color: var(--accent-red); font-size: 13px; font-weight: 600; padding: 12px 24px; border-radius: 10px; cursor: pointer; width: 100%;" onclick="confirmDelete()">
                    🗑️ Delete My Account & Data
                </button>
            </div>

        </main>
    </div>

    <!-- MODALS SECTION -->
    <div class="sheet-overlay" id="overlay" onclick="closeAllModals()"></div>

    <!-- Language Switcher Modal -->
    <div class="bottom-sheet" id="lang-modal">
        <div style="width: 40px; height: 5px; background: var(--card-border); border-radius: 10px; margin: 0 auto 20px auto;"></div>
        <h3 style="margin: 0 0 16px 0; font-size: 18px;">Choose Language</h3>
        <div class="flex-column gap-3">
            <div class="cp-card flex-between" style="margin:0; border-color: var(--accent-blue); background: rgba(59,130,246,0.05);" onclick="showToast('Language updated to English'); closeAllModals()">
                <div style="font-weight: 700;">English</div>
                <div style="width: 20px; height: 20px; background: var(--accent-blue); border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px;">✓</div>
            </div>
            <div class="cp-card flex-between" style="margin:0;" onclick="showToast('Language updated to Hindi'); closeAllModals()">
                <div style="font-weight: 700;">हिंदी (Hindi)</div>
            </div>
            <div class="cp-card flex-between" style="margin:0;" onclick="showToast('Language updated to Bengali'); closeAllModals()">
                <div style="font-weight: 700;">বাংলা (Bengali)</div>
            </div>
        </div>
    </div>

    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/config.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/store.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const themeToggle = document.getElementById('theme-toggle');
            themeToggle.checked = CityStore.getTheme() === 'dark';
        });

        function openModal(modalId) {
            document.getElementById('main-container').classList.add('show-modal');
            document.querySelectorAll('.bottom-sheet').forEach(sheet => { sheet.style.bottom = '-100%'; });
            document.getElementById(modalId).style.bottom = '0';
        }

        function closeAllModals() {
            document.getElementById('main-container').classList.remove('show-modal');
            document.querySelectorAll('.bottom-sheet').forEach(sheet => { sheet.style.bottom = '-100%'; });
        }

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('cp_theme', 'dark');
            } else {
                localStorage.setItem('cp_theme', 'light');
            }
        }

        function confirmDelete() {
            let res = confirm("DANGER: This action is irreversible. All your wallet data, complaints, and KYC will be deleted. Do you want to proceed?");
            if(res) {
                showToast("Account deletion request submitted.");
            }
        }
    </script>
</body>
</html>
