<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Support</title>
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
    <style>
        .support-tabs { display: flex; background: rgba(150,150,150,0.1); border-radius: 12px; margin-bottom: 16px; padding: 4px; }
        .support-tab { flex: 1; text-align: center; padding: 10px; font-size: 12px; font-weight: 700; border-radius: 8px; cursor: pointer; color: var(--text-muted); }
        .support-tab.active { background: var(--card-bg); color: var(--text-main); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="max-width-container">
        <city-topbar title="Help & Support"></city-topbar>
        
        <main style="padding: 10px 16px; margin-bottom: 80px;" class="flex-column gap-3">
            
            <div class="support-tabs">
                <div class="support-tab" id="btn-faq" onclick="switchTab('faq')">❓ FAQs</div>
                <div class="support-tab active" id="btn-ticket" onclick="switchTab('ticket')">📞 Contact Us</div>
            </div>

            <!-- TAB 1: FAQs (Simplified for brevity) -->
            <div id="tab-faq" style="display: none;">
                <div class="cp-card">
                    <h3 style="margin: 0; font-size: 14px;">Common Questions</h3>
                    <p style="font-size: 12px; color: var(--text-muted);">How to add money to wallet?</p>
                    <p style="font-size: 12px; color: var(--text-muted);">How to register a shop?</p>
                </div>
            </div>

            <!-- TAB 2: DIRECT CONTACT & TICKETS (DEEPEST UPDATE) -->
            <div id="tab-ticket" class="flex-column gap-3">
                
                <!-- Direct Contact Buttons -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="cp-card" style="padding: 12px; text-align: center; margin: 0; cursor: pointer; background: rgba(16, 185, 129, 0.1); border: 1px solid var(--accent-green);" onclick="window.open('https://wa.me/919876543210')">
                        <div style="font-size: 24px; margin-bottom: 4px;">💬</div>
                        <div style="font-size: 12px; font-weight: 700; color: var(--accent-green);">WhatsApp Us</div>
                        <div style="font-size: 10px; color: var(--text-muted);">Avg reply: 5 mins</div>
                    </div>
                    <div class="cp-card" style="padding: 12px; text-align: center; margin: 0; cursor: pointer; background: rgba(59,130,246,0.1); border: 1px solid var(--accent-blue);" onclick="window.open('tel:18001234567')">
                        <div style="font-size: 24px; margin-bottom: 4px;">📞</div>
                        <div style="font-size: 12px; font-weight: 700; color: var(--accent-blue);">Call Support</div>
                        <div style="font-size: 10px; color: var(--text-muted);">Toll-Free (9 AM - 6 PM)</div>
                    </div>
                </div>

                <div class="cp-card flex-between" style="padding: 12px; margin: 0; cursor: pointer;" onclick="window.location.href='mailto:support@citypulse.com'">
                    <div class="d-flex gap-3 align-items-center">
                        <span style="font-size: 20px;">📧</span>
                        <div>
                            <div style="font-size: 13px; font-weight: 700;">Email Us</div>
                            <div style="font-size: 11px; color: var(--text-muted);">support@citypulse.com</div>
                        </div>
                    </div>
                    <span style="color: var(--text-muted);">›</span>
                </div>

                <!-- Raise Ticket Form -->
                <div class="cp-card flex-column gap-3" style="margin: 0; margin-top: 10px;">
                    <h3 style="margin: 0; font-size: 14px;">Raise a Support Ticket</h3>
                    <select class="cp-input"><option>Payment Issue</option><option>App Bug</option></select>
                    <textarea rows="3" class="cp-input" placeholder="Explain your issue here..."></textarea>
                    <button class="cp-btn-primary" onclick="showToast('Ticket Raised!')">Submit Ticket</button>
                </div>
            </div>

        </main>
    </div>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>
    <script>
        function switchTab(tab) {
            document.getElementById('tab-faq').style.display = tab === 'faq' ? 'flex' : 'none';
            document.getElementById('tab-ticket').style.display = tab === 'ticket' ? 'flex' : 'none';
            document.getElementById('btn-faq').className = tab === 'faq' ? 'support-tab active' : 'support-tab';
            document.getElementById('btn-ticket').className = tab === 'ticket' ? 'support-tab active' : 'support-tab';
        }
    </script>
</body>
</html>
